<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENU — MARROW</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>*{font-family:'DM Sans',sans-serif}.display{font-family:'Instrument Serif',serif}</style></head>
<body class="bg-[#F6F1EB] text-[#151A18]">
<nav class="border-b border-black/10 px-6 md:px-10 py-6 flex justify-between items-center max-w-[1400px] mx-auto">
<a href="index.html" class="display text-2xl">MARROW</a>
<div class="flex gap-6 text-[11px] font-bold tracking-widest"><a href="index.html" class="opacity-50">HOME</a><a href="menu.html" class="border-b border-black">MENU</a><a href="reserve.html" class="opacity-50">RESERVE</a></div>
<span class="bg-[#151A18] text-white px-5 py-2.5 rounded-full text-[11px] font-bold">ORDER — <span id="nav-count">0</span></span>
</nav>

<section class="max-w-[1400px] mx-auto px-6 md:px-10 mt-8 grid md:grid-cols-12 gap-6">
<div class="md:col-span-8">
<div class="flex justify-between items-end"><h2 class="display text-6xl">Menu</h2><p class="text-[11px] opacity-60">Pick a tasty meal and enjoy.</p></div>
<div id="menu-grid" class="mt-8 space-y-4"></div>
</div>
<div class="md:col-span-4">
<div class="sticky top-8 bg-[#151A18] text-[#F6F1EB] rounded-[28px] p-8">
<div class="flex justify-between items-center"><h3 class="display text-3xl">Order</h3><button onclick="clearOrder()" class="text-[10px] tracking-widest opacity-60 border border-white/20 px-3 py-1 rounded-full">CLEAR</button></div>
<div id="order-list" class="mt-6 space-y-3 min-h-[180px]"></div>
<div class="border-t border-white/10 mt-6 pt-4 flex justify-between"><span class="text-[12px] tracking-widest opacity-60">TOTAL</span><span id="total" class="font-bold text-xl">R0</span></div>
<input id="name" placeholder="Name" class="mt-6 w-full bg-white/10 border border-white/10 rounded-full px-5 py-3 text-[13px] outline-none">
<button onclick="checkout()" class="mt-4 w-full bg-[#FF3B1F] text-white rounded-full py-4 font-bold text-[11px] tracking-widest">SEND TO WHATSAPP — <span id="checkout-total">R0</span></button>
</div>
</div>
</section>

<script>
const dishes=[
 {id:1,name:"300G RIBEYE — OAK SMOKE",price:295,cat:"FIRE",img:"https://images.unsplash.com/photo-1546964053-d54e2d3a19ce?w=600&q=80"},
 {id:2,name:"HALF CHICKEN — LEMON & GARLIC",price:185,cat:"FIRE",img:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600&q=80"},
 {id:3,name:"BURRATA — BURNT TOMATO",price:145,cat:"SMALL",img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80"},
 {id:4,name:"TRIPLE CHEESE BURGER",price:165,cat:"FIRE",img:"https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600&q=80"},
 {id:5,name:"CHARRED BROCCOLI — ANCHOVY",price:95,cat:"SMALL",img:"https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&q=80"},
 {id:6,name:"TIRAMISU — ESPRESSO",price:85,cat:"SWEET",img:"https://images.unsplash.com/photo-1571877222312-a941315a5e5b?w=600&q=80"},
];
function getOrder(){return JSON.parse(localStorage.getItem('marrow_order')||'[]')}
function saveOrder(o){localStorage.setItem('marrow_order',JSON.stringify(o))}
function addDish(id){let o=getOrder(); if(!o.find(x=>x.id===id)) o.push(dishes.find(d=>d.id===id)); saveOrder(o); render()}
function removeDish(id){saveOrder(getOrder().filter(x=>x.id!==id)); render()}
function clearOrder(){saveOrder([]); render()}
function render(){
document.getElementById('menu-grid').innerHTML=dishes.map(d=>`
<div class="bg-white rounded-[20px] p-3 flex gap-4 items-center border border-black/5">
<img src="${d.img}" class="w-20 h-20 md:w-24 md:h-24 rounded-[14px] object-cover flex-shrink-0">
<div class="flex-1 min-w-0">
<p class="text-[10px] tracking-[0.2em] opacity-50">${d.cat}</p>
<p class="font-bold text-[13px] md:text-[14px] leading-tight mt-1">${d.name}</p>
<p class="text-[12px] opacity-60 mt-1">Wood-fired, served with bread</p>
</div>
<div class="flex flex-col items-end gap-2 pr-2">
<span class="font-bold text-[16px]">R${d.price}</span>
<button onclick="addDish(${d.id})" class="bg-[#151A18] text-white w-9 h-9 rounded-full font-bold text-[16px]">+</button>
</div>
</div>`).join('');
let order=getOrder();
document.getElementById('order-list').innerHTML=order.length?order.map(d=>`
<div class="flex gap-3 items-center bg-white/10 rounded-full pr-2 pl-1 py-1 text-[12px]">
<img src="${d.img}" class="w-8 h-8 rounded-full object-cover">
<span class="flex-1 font-bold text-[11px]">${d.name}</span>
<span>R${d.price} <button onclick="removeDish(${d.id})" class="ml-1 bg-white/20 w-5 h-5 rounded-full">x</button></span>
</div>`).join(''):`<p class="opacity-60 text-[13px]">No items — tap + to add.</p>`;
let tot=order.reduce((a,b)=>a+b.price,0); document.getElementById('total').innerText='R'+tot; document.getElementById('checkout-total').innerText='R'+tot; document.getElementById('nav-count').innerText=order.length;
}
function checkout(){let o=getOrder(); if(!o.length) return alert('Add dish!'); let name=document.getElementById('name').value||'Guest'; let txt=`MARROW ORDER:%0A${o.map(d=>d.name+' R'+d.price).join('%0A')}%0ATotal R${o.reduce((a,b)=>a+b.price,0)}%0AName: ${name}`; window.open('https://wa.me/27600000000?text='+txt,'_blank')}
render();
</script>
</body></html>
